<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Content Security Policy for XSS Protection -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://utteranc.es https://ws.audioscrobbler.com https://subscriber-api-lolroxs.vercel.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://utteranc.es https://api.github.com https://ws.audioscrobbler.com https://subscriber-api-lolroxs.vercel.app; frame-src https://utteranc.es;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{ page.title }} - {{ site.title }}</title>

  <!-- Preconnect to critical third-party origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://utteranc.es">
  <link rel="dns-prefetch" href="https://ws.audioscrobbler.com">
  <link rel="dns-prefetch" href="https://subscriber-api-lolroxs.vercel.app">

  <!-- Google Fonts loaded via link instead of CSS @import for parallel loading -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">

  <style>
    /* Critical CSS to prevent flash of unstyled content */
    :root {
      --color-primary: #6df;
      --color-bg: #111;
      --color-bg-secondary: #1a1a1a;
      --color-bg-tertiary: #222;
      --color-text: #ddd;
      --color-text-dim: #666;
    }
    .no-flash { visibility: hidden; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .site-header, .site-footer, .container {
      padding: 20px;
    }
    .site-header {
      background-color: var(--color-bg-tertiary);
      border-bottom: 3px solid var(--color-primary);
    }
    .site-footer {
      background-color: var(--color-bg-tertiary);
      border-top: 3px solid var(--color-primary);
      font-size: 0.8em;
      color: var(--color-text-dim);
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: var(--color-bg-secondary);
      border-radius: 8px;
      box-shadow: 0 0 10px #000;
    }
    /* Critical nav styles to prevent layout shift */
    .site-nav { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .nav-select { width: min(280px, 90vw); padding: 8px 12px; border-radius: 6px; }
  </style>
  <!-- Defer non-critical CSS: load async, fallback for no-JS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></noscript>
</head>
<body class="no-flash">
  {% include header.html %}
  <div class="container">
    {{ content }}
  </div>
  {% include footer.html %}
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.body.classList.remove("no-flash");
    });
  </script>
</body>
</html>
