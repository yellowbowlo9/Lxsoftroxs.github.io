---
layout: default
title: "Daily Journal"
permalink: /journal/
---
<h1>Daily Journal</h1>

<!-- Month Navigation Controls -->
<div id="calendar-controls" style="text-align:center; margin-bottom:10px;">
  <button id="prev-month">Previous Month</button>
  <span id="month-display" style="margin: 0 15px; font-weight:bold;"></span>
  <button id="next-month">Next Month</button>
</div>

<div id="calendar"></div>

<script>
  // Build an array of journal entries from your _journal collection using Liquid.
  // Each entry includes its date (formatted as YYYY-MM-DD), title, and URL.
  var journalEntries = [
  {% for entry in site.journal %}
    {
      "date": "{{ entry.date | date: '%Y-%m-%d' }}",
      "title": "{{ entry.title | escape }}",
      "url": "{{ entry.url | relative_url }}"
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
  ];

  // Global variables for current displayed month (0-indexed) and year.
  var today = new Date();
  var currentYear = today.getFullYear();
  var currentMonth = today.getMonth();

  // Build a lookup map for journal entries by date for O(1) access
  var entryMap = {};
  journalEntries.forEach(function(e) { entryMap[e.date] = e; });

  // Build a calendar for a given year and month using innerHTML for fewer DOM ops
  function buildCalendar(year, month) {
    var calendarDiv = document.getElementById('calendar');
    var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('month-display').textContent = monthNames[month] + ' ' + year;

    var daysOfWeek = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var startingDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var cellStyle = 'border:1px solid #666;padding:10px;text-align:center;';
    var html = '<table style="margin:0 auto;border-collapse:collapse;width:80%;max-width:600px;">';
    html += '<tr>';
    daysOfWeek.forEach(function(day) {
      html += '<th style="border:1px solid #666;padding:5px;">' + day + '</th>';
    });
    html += '</tr>';

    var date = 1;
    for (var i = 0; i < 6; i++) {
      html += '<tr>';
      for (var j = 0; j < 7; j++) {
        if (i === 0 && j < startingDay) {
          html += '<td style="' + cellStyle + '"></td>';
        } else if (date > daysInMonth) {
          html += '<td style="' + cellStyle + '"></td>';
        } else {
          var cellDate = year + '-' + (month + 1).toString().padStart(2, '0') + '-' + date.toString().padStart(2, '0');
          var entry = entryMap[cellDate];
          if (entry) {
            html += '<td style="' + cellStyle + 'background-color:#444;cursor:pointer;" title="' + entry.title + '" data-url="' + entry.url + '">' + date + '</td>';
          } else {
            html += '<td style="' + cellStyle + '">' + date + '</td>';
          }
          date++;
        }
      }
      html += '</tr>';
    }
    html += '</table>';
    calendarDiv.innerHTML = html;

    // Use event delegation instead of per-cell listeners
    calendarDiv.addEventListener('click', function(e) {
      var td = e.target.closest('td[data-url]');
      if (td) window.location.href = td.dataset.url;
    });
  }

  // Event listeners for previous and next month buttons.
  document.getElementById('prev-month').addEventListener('click', function() {
    currentMonth--;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    buildCalendar(currentYear, currentMonth);
  });
  document.getElementById('next-month').addEventListener('click', function() {
    currentMonth++;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    buildCalendar(currentYear, currentMonth);
  });

  // Initially build the calendar for the current month.
  buildCalendar(currentYear, currentMonth);
</script>
